name: Update SMP/REC widget image

on:
  schedule:
    # 매시 5분에 실행 (UTC 기준). DATA_GO_KR_KEY 비밀값이 없으면 fetch 단계는 스스로 건너뜁니다.
    - cron: "5 * * * *"
  push:
    # smp.json / rec.json 을 GitHub 화면에서 손으로 고치고 저장하면, 그 즉시 이미지도 다시 그립니다.
    paths:
      - "smp.json"
      - "rec.json"
      - "scripts/**"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies (Pillow + 한글 폰트)
        run: |
          pip install --quiet pillow
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk

      - name: Fetch latest SMP/REC data (키 없으면 자동으로 건너뜀)
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
        run: python3 scripts/fetch_data.py

      - name: Render widget image
        run: python3 scripts/render_image.py

      - name: Commit updated files (변경 있을 때만)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add smp.json rec.json widget.png
          git diff --cached --quiet || git commit -m "chore: update SMP/REC widget"
          git push
